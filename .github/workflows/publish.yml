name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # v1.2.3, v1.2.3-beta.1

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer derives the version from git tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution PingPong.slnx --configuration Release

      - name: Pack
        run: dotnet pack PingPong.slnx --configuration Release --output ./artifacts

      - name: Verify package version matches tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="artifacts/PingPong.Heartbeat.${version}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::Expected $package, found: $(ls artifacts)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Required for the NuGet trusted publishing OIDC token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          # Safe to re-run: skip when the release already exists.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
