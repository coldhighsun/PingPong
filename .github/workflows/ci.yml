name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from git tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore PingPong.slnx

      - name: Build
        run: dotnet build PingPong.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution PingPong.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack PingPong.slnx --configuration Release --output ./artifacts
