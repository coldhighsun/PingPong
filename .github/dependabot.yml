version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # One PR for all major updates, one PR for all minor and patch updates.
      major:
        update-types:
          - major
      minor-and-patch:
        update-types:
          - minor
          - patch
